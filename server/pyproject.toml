[project]
name = "waifu-tutor-server"
version = "0.1.0"
description = "Tutor brain backend for the Waifu Tutor app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.55",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "kokoro-onnx>=0.4.4",
    "pypdf>=4.0",
    "python-multipart>=0.0.32",
]

[tool.uv]
package = false
